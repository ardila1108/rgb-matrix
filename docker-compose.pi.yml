# Raspberry Pi: real panel. Built on the Pi itself (first build takes a few minutes).
services:
  led-wall:
    build:
      context: .
      args:
        WITH_HARDWARE: "1"
    privileged: true        # the panel library needs raw GPIO / /dev/mem access
    ports:
      - "8080:8080"         # phone page: http://<pi-ip>:8080
    volumes:
      - led-data:/app/data  # keeps your sketch across restarts and deploys
    restart: unless-stopped
    depends_on:
      - dbus-api
    environment:
      LED_BACKEND: hardware
      LED_DATA_DIR: /app/data
      LED_SCREEN: ${LED_SCREEN:-}   # empty = use settings.py
      LED_DATA: ${LED_DATA:-}       # demo | live (empty = settings.py)
      LED_API_URL: ${LED_API_URL:-} # empty = http://dbus-api:3000

  dbus-api:
    image: ardila1108/dbus-api:latest
    init: true                    # reaps leftover Chrome processes
    shm_size: "256mb"             # Docker's default 64 MB makes Chrome hang
    environment:
      RATE_LIMIT_MAX: "100000"    # default is 100 requests / 15 min: the screen asks far more
      NODE_ENV: production
      LOG_LEVEL: info
      WARM_LINES: "24,9"          # the lines used in routes.py, fills the caches at startup
    # Keep the cache across restarts: use the folder your Dockerfile's WORKDIR + /cache
    # volumes:
    #   - dbus-cache:/app/cache
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  led-data:
